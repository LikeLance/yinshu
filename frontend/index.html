<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fb">
<title>银枢 YinShu · 可信银行智能体</title>
<style>
  :root{
    --canvas:#f3f6fb;--surface:#fff;--surface-2:#f7f9fc;--surface-3:#eef2f8;
    --ink:#17233b;--ink-2:#44516a;--muted:#718096;--line:#e3e9f1;
    --brand:#3159d9;--brand-dark:#2446b5;--brand-soft:#edf2ff;
    --ok:#087b67;--ok-soft:#e9f7f2;--warn:#9a5b0b;--warn-soft:#fff6e7;
    --danger:#bd3d49;--danger-soft:#fff0f1;
    --shadow:0 24px 70px rgba(31,48,82,.10),0 2px 8px rgba(31,48,82,.04);
    --radius:22px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 8% -10%,rgba(90,126,224,.12),transparent 65%),radial-gradient(700px 420px at 100% 0,rgba(44,168,145,.08),transparent 60%)}
  button,input{font:inherit}
  button{cursor:pointer}
  button:disabled{cursor:not-allowed;opacity:.48}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid rgba(49,89,217,.24);outline-offset:3px}
  .icon{width:18px;height:18px;display:inline-block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .svg-sprite{position:absolute;width:0;height:0;overflow:hidden}

  .app-shell{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 380px;width:min(1180px,calc(100% - 40px));height:min(900px,calc(100dvh - 40px));min-height:580px;margin:20px auto;background:var(--surface);border:1px solid rgba(219,227,239,.9);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .conversation-panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
  .app-header{min-height:82px;padding:18px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);z-index:2}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#274bbf,#4773e8);color:#fff;box-shadow:0 7px 18px rgba(49,89,217,.22)}
  .brand-mark .icon{width:22px;height:22px}
  .brand-name{font-size:16px;font-weight:720;letter-spacing:.01em;line-height:1.3}
  .brand-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
  .header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .security-status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:11px;font-weight:650;white-space:nowrap}
  .status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(8,123,103,.10)}
  .icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink-2);transition:background .18s,border-color .18s,color .18s}
  .icon-btn:hover{background:var(--surface-2);border-color:#cbd5e5;color:var(--brand)}
  .mobile-trace{display:none}

  .chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;padding:26px 28px 20px;background:linear-gradient(180deg,#fbfcfe 0%,#f7f9fc 100%)}
  .chat::-webkit-scrollbar,.insights-body::-webkit-scrollbar{width:5px}
  .chat::-webkit-scrollbar-thumb,.insights-body::-webkit-scrollbar-thumb{background:#d4ddea;border-radius:10px}
  .welcome{padding:14px 2px 24px;animation:rise .35s ease both}
  .welcome-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:var(--brand-soft);color:var(--brand);margin-bottom:20px}
  .welcome-icon .icon{width:25px;height:25px}
  .eyebrow{font-size:10px;font-weight:750;letter-spacing:.16em;color:var(--brand);text-transform:uppercase;margin-bottom:8px}
  .welcome h1{font-size:27px;line-height:1.35;letter-spacing:-.035em;margin:0 0 10px;font-weight:730}
  .welcome>p{font-size:13px;line-height:1.8;color:var(--ink-2);max-width:520px;margin:0}
  .trust-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .trust-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
  .trust-item .icon{width:14px;height:14px;color:var(--ok)}

  .msg{display:flex;gap:10px;margin:0 0 18px;animation:rise .25s ease both}
  .msg.me{justify-content:flex-end;padding-left:56px}
  .avatar{width:30px;height:30px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:0 0 auto;margin-top:2px}
  .avatar .icon{width:17px;height:17px}
  .bubble{min-width:0;max-width:calc(100% - 40px);font-size:13px;line-height:1.75;color:var(--ink-2)}
  .msg.me .bubble{max-width:80%;padding:10px 15px;border-radius:16px 16px 4px 16px;background:var(--brand);color:#fff;box-shadow:0 5px 16px rgba(49,89,217,.16)}
  .reply{padding:2px 0 0;color:var(--ink);font-weight:520}
  .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .meta span+span::before{content:"·";margin-right:6px;color:#a8b3c3}
  .typing{display:flex;align-items:center;gap:5px;height:34px;padding:0 4px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#9cabc0;animation:bounce 1s infinite}
  .typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}
  .typing-label{font-size:11px;color:var(--muted);margin-left:5px}

  .card{margin-top:10px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--surface);box-shadow:0 2px 7px rgba(31,48,82,.025)}
  .card-h{min-height:44px;padding:11px 13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);font-size:12px;font-weight:680;color:var(--ink)}
  .card-h>.icon{width:16px;height:16px;color:var(--brand)}
  .card-b{padding:13px}
  .tag{display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding:3px 7px;border-radius:6px;font-size:9.5px;font-weight:700;white-space:nowrap}
  .tag.auto{background:var(--ok-soft);color:var(--ok)}
  .tag.confirm{background:var(--warn-soft);color:var(--warn)}
  .tag.danger{background:var(--danger-soft);color:var(--danger)}
  .rows{display:flex;flex-direction:column;gap:9px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;font-size:12px}
  .row .k{color:var(--muted);flex:0 0 auto}
  .row .v{text-align:right;color:var(--ink);font-weight:620;overflow-wrap:anywhere}
  .note{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:10.5px;line-height:1.7;color:var(--muted)}
  .reasons{margin-top:12px;background:var(--warn-soft);border-radius:10px;padding:10px 11px}
  .reasons h5{display:flex;align-items:center;gap:5px;margin:0 0 6px;font-size:10.5px;color:var(--warn);font-weight:700}
  .reasons h5 .icon{width:13px;height:13px}
  .reasons ul{margin:0;padding-left:16px}
  .reasons li{font-size:10.5px;line-height:1.65;color:#76501e;margin:2px 0}
  .btns{display:flex;gap:8px;margin-top:13px}
  .btn{min-height:40px;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:11px;padding:9px 13px;font-size:12px;font-weight:680;background:var(--brand);color:#fff;transition:background .18s,transform .18s,border-color .18s}
  .btn:hover:not(:disabled){background:var(--brand-dark)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn.ghost{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
  .btn.ghost:hover:not(:disabled){background:var(--surface-3);border-color:#cbd5e5}
  .btn.danger{background:var(--danger)}
  .btn .icon{width:15px;height:15px}
  .confirm-card{border-color:#ead9b9}
  .confirm-card .card-h{background:#fffaf1;border-bottom-color:#f1e4cd}
  .confirm-card .card-h>.icon{color:var(--warn)}
  .receipt-card{border-color:#cde8df}
  .receipt-card .card-h{background:#f4fbf8;border-bottom-color:#dcefe9}
  .receipt-card .card-h>.icon{color:var(--ok)}
  .plan-card{box-shadow:none;background:var(--surface-2)}
  .plan-card summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:11px;font-weight:650;color:var(--ink-2);user-select:none}
  .plan-card summary::-webkit-details-marker{display:none}
  .plan-card summary .icon{width:15px;height:15px;color:var(--brand)}
  .plan-card summary .chevron{margin-left:auto;transition:transform .2s}
  .plan-card[open] summary .chevron{transform:rotate(180deg)}
  .plan-card .card-b{border-top:1px solid var(--line);background:var(--surface)}
  .steps{display:flex;flex-direction:column}
  .step{display:flex;gap:10px;font-size:11px;position:relative;padding-bottom:13px}
  .step:last-child{padding-bottom:0}
  .step .num{width:19px;height:19px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:9px;display:grid;place-items:center;flex:0 0 auto;font-weight:750;z-index:1}
  .step.gated .num{background:var(--warn-soft);color:var(--warn)}
  .step::before{content:"";position:absolute;left:9px;top:19px;bottom:0;width:1px;background:var(--line)}
  .step:last-child::before{display:none}
  .step-label{color:var(--ink-2);line-height:1.45}
  .step .tool{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px}
  .continuation{margin-top:10px;padding:11px 12px;border:1px solid #ead9b9;background:#fffaf1;border-radius:12px}
  .continuation-title{font-size:11px;color:var(--warn);font-weight:650}

  .bars{display:flex;flex-direction:column;gap:11px}
  .bill-total{font:700 25px/1.2 var(--mono);letter-spacing:-.04em;color:var(--ink)}
  .bill-unit{font:11px/1.5 inherit;color:var(--muted);margin-left:6px}
  .bill-range{font:9.5px/1.5 var(--mono);color:var(--muted);margin:5px 0 15px}
  .bar-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;font-size:10.5px}
  .bar-top .n{color:var(--ink-2)}.bar-top .a{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .bar-bg{height:6px;border-radius:10px;background:var(--surface-3);overflow:hidden}
  .bar-fill{height:100%;border-radius:10px;background:var(--brand)}
  .bar-row:nth-child(2) .bar-fill{background:#1b9581}.bar-row:nth-child(3) .bar-fill{background:#c18332}.bar-row:nth-child(4) .bar-fill{background:#7961b8}
  .anom{border-left:3px solid var(--danger);background:#fffafa;border-radius:8px;padding:9px 10px;margin-bottom:8px}
  .anom .l1{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:650;color:var(--ink)}
  .anom .l2{font-size:10px;line-height:1.6;color:#8b6268;margin-top:4px}
  .mini-chip{display:inline-block;font-size:9px;padding:2px 5px;border-radius:5px;background:var(--danger-soft);color:var(--danger);margin-right:5px;font-weight:650}
  .prod{border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;background:var(--surface)}
  .prod:last-child{margin-bottom:0}.prod .pn{font-size:11.5px;font-weight:650;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .prod .rate{color:var(--danger);font-family:var(--mono);font-size:15px;font-weight:750;white-space:nowrap}
  .prod .pm{font-size:9.5px;color:var(--muted);margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
  .pill{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
  .sub-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11.5px}
  .sub-item:first-child{padding-top:0}.sub-item:last-child{border:none;padding-bottom:0}
  .sub-item .m{font-weight:650;color:var(--ink)}.sub-item .d{font-size:9.5px;color:var(--muted);margin-top:3px}.sub-item .amt{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:right}
  .opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;margin-bottom:8px;transition:border-color .18s,background .18s,transform .18s;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:#aebfe9;background:var(--brand-soft);transform:translateY(-1px)}
  .opt .ol{font-size:11.5px;font-weight:650}.opt .os{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.55}
  .notice{display:flex;gap:10px;align-items:stretch}.notice .bar{width:3px;flex:0 0 auto;border-radius:4px;background:var(--muted)}
  .notice.warn .bar{background:var(--warn)}.notice.danger .bar{background:var(--danger)}.notice.ok .bar{background:var(--ok)}
  .notice ul{margin:0;padding-left:16px;font-size:11px;line-height:1.75;color:var(--ink-2)}
  .error-box{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid #efcfd2;background:var(--danger-soft);border-radius:12px;color:var(--danger)}
  .error-box .icon{margin-top:2px}.error-title{font-size:11.5px;font-weight:700}.error-text{font-size:10.5px;line-height:1.6;margin-top:3px}
  .error-box .btn{flex:0 0 auto;min-height:32px;padding:5px 10px;font-size:10px;background:#fff;color:var(--danger);border-color:#efcfd2}

  .input-dock{flex:0 0 auto;padding:12px 22px 15px;background:var(--surface);border-top:1px solid var(--line)}
  .quick-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;font-size:10px;color:var(--muted)}
  .quick-head span:first-child{font-weight:650;color:var(--ink-2)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip-btn{white-space:nowrap;font-size:10.5px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);transition:background .18s,border-color .18s,color .18s}
  .chip-btn:hover:not(:disabled){background:var(--brand-soft);border-color:#bdcaf0;color:var(--brand)}
  .composer{display:flex;gap:9px;margin-top:5px}
  .input-wrap{flex:1;min-width:0;position:relative}
  .composer input{width:100%;height:46px;border:1px solid #dce4ef;background:var(--surface-2);border-radius:13px;padding:0 14px;font-size:12px;color:var(--ink);outline:none;transition:border-color .18s,background .18s,box-shadow .18s}
  .composer input::placeholder{color:#929eb0}
  .composer input:focus{border-color:#9fb3e9;background:#fff;box-shadow:0 0 0 3px rgba(49,89,217,.08)}
  .send-btn{height:46px;min-width:88px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:13px;background:var(--brand);color:#fff;font-size:12px;font-weight:680;box-shadow:0 5px 14px rgba(49,89,217,.16);transition:background .18s}
  .send-btn:hover:not(:disabled){background:var(--brand-dark)}
  .composer-note{display:flex;align-items:center;justify-content:center;gap:5px;font-size:9.5px;color:var(--muted);margin-top:10px}
  .composer-note .icon{width:12px;height:12px;color:var(--ok)}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}

  .insights{min-width:0;display:flex;flex-direction:column;background:var(--surface-2);border-left:1px solid var(--line)}
  .insights-header{min-height:82px;padding:18px 20px;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line)}
  .insights-title{font-size:13px;font-weight:700}.insights-subtitle{font-size:10px;color:var(--muted);margin-top:3px}
  .insights-header .status-dot{color:var(--ok);background:var(--ok)}
  .drawer-close{display:none;margin-left:auto}
  .insights-tabs{display:flex;gap:4px;margin:16px 18px 0;padding:4px;background:var(--surface-3);border-radius:11px}
  .tab-btn{flex:1;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:10.5px;font-weight:620;padding:8px;transition:background .18s,color .18s,box-shadow .18s}
  .tab-btn[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(31,48,82,.08)}
  .insights-body{flex:1;min-height:0;overflow-y:auto;padding:16px 18px}
  .debug-empty{height:100%;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:24px}
  .debug-empty .empty-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--surface-3);color:#8291a8;margin-bottom:14px}
  .debug-empty h2{font-size:12px;color:var(--ink-2);margin:0 0 7px}.debug-empty p{font-size:10px;line-height:1.7;margin:0;max-width:220px}
  .trace-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  .trace-label{font-size:9px;font-weight:750;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
  .trace-intent{font-size:17px;font-weight:720;letter-spacing:-.02em;color:var(--ink)}
  .state-pill{font-size:9px;font-weight:700;padding:5px 7px;border-radius:7px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
  .debug-card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:11px}
  .debug-card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;font-size:10.5px;font-weight:700;color:var(--ink)}
  .debug-card-h .icon{width:15px;height:15px;color:var(--brand)}
  .debug-card-h>span:first-child{display:flex;align-items:center;gap:6px}
  .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .metric{min-width:0}.metric-label{font-size:9px;color:var(--muted);margin-bottom:4px}.metric-value{font-size:11px;font-weight:680;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .decision-top{display:flex;align-items:center;gap:12px}
  .risk-score{font:730 26px/1 var(--mono);letter-spacing:-.06em;color:var(--warn)}
  .risk-copy{font-size:9.5px;line-height:1.5;color:var(--muted)}
  .risk-copy strong{display:block;font-size:11px;color:var(--warn);margin-bottom:2px}
  .risk-track{height:5px;background:var(--surface-3);border-radius:10px;margin:11px 0;overflow:hidden}
  .risk-fill{height:100%;border-radius:10px;background:var(--warn)}
  .decision-reasons{margin:0;padding-left:15px;font-size:9.5px;line-height:1.65;color:var(--ink-2)}
  .decision-reasons li+li{margin-top:3px}
  .debug-step{display:grid;grid-template-columns:20px minmax(0,1fr);gap:9px;position:relative;padding-bottom:12px}
  .debug-step:last-child{padding-bottom:0}.debug-step::before{content:"";position:absolute;left:9.5px;top:20px;bottom:0;width:1px;background:var(--line)}.debug-step:last-child::before{display:none}
  .debug-step .num{width:20px;height:20px;border-radius:6px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:9px;font-weight:750;z-index:1}
  .debug-step-name{font-size:10px;color:var(--ink-2);line-height:1.45}.debug-step-tool{font:8.5px/1.5 var(--mono);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .audit-line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:9.5px;color:var(--muted)}.audit-line strong{font-family:var(--mono);font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
  .audit-result{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:9px;border-radius:9px;background:var(--ok-soft);color:var(--ok);font-size:9.5px;line-height:1.55}.audit-result.bad{background:var(--danger-soft);color:var(--danger)}.audit-result .icon{width:14px;height:14px;margin-top:1px}

    .card-b{padding:12px}.card-h{padding:10px 12px}.row{font-size:11px}.tag{font-size:8.5px}.btns{gap:7px}.btn{font-size:11px;padding:9px}
    .input-dock{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}.quick-head{margin-bottom:7px}.composer-note{font-size:8.5px}.send-btn{min-width:52px;width:52px}.send-btn span:not(.spinner){display:none}

</style>

<script>
const chat = document.getElementById('chat');
const dbg = document.getElementById('debugBody');
const appShell = document.getElementById('appShell');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const verifyBtn = document.getElementById('verify');
const insights = document.getElementById('insights');
const overlay = document.getElementById('drawerOverlay');
let sessionId = localStorage.getItem('ys_sid') || null;
let busy = false;
let lastDebug = null;
let lastState = null;
let lastRaw = null;
let lastAudit = null;
let debugView = 'overview';
let toastTimer;

const icon = (name, cls = '') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = n => Math.max(0, Math.min(100, Number(n) || 0));
const STATE_LABELS = { IDLE:'已完成', CLARIFY:'待补充', CHOOSE:'待选择', AWAIT_CONFIRM:'待确认' };
const TIER_LABELS = { AUTO:'自动执行', CONFIRM:'需要确认', HANDOFF:'人工复核', DENY:'已拦截' };

function toast(message) {
  document.getElementById('toastText').textContent = message;
  document.getElementById('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => document.getElementById('toast').classList.remove('show'), 2800);
}

function getDeviceId() {
  let deviceId = localStorage.getItem('ys_did');
  if (!deviceId) {
    deviceId = 'web-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('ys_did', deviceId);
  }
  return deviceId;
}

async function apiFetch(url, options = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  try {
    const response = await fetch(url, {
      ...options,
      headers: { 'Content-Type':'application/json', 'X-Device-Id':getDeviceId(), ...(options.headers || {}) },
      signal: controller.signal
    });
    const data = await response.json().catch(() => null);
    if (!response.ok) {
      const error = new Error(data?.error?.message || `服务返回异常（HTTP ${response.status}）`);
      error.status = response.status;
      throw error;
    }
    if (!data) throw new Error('服务返回了无法识别的数据');
    return data;
  } finally {
    clearTimeout(timer);
  }
}

function friendlyError(error) {
  if (error.name === 'AbortError') return '请求超时，请检查网络后重试。';
  if (error instanceof TypeError) return '暂时无法连接银枢服务，请确认后端已启动。';
  if (error.status === 401) return '当前环境需要身份验证，请完成登录或配置访问凭证。';
  if (error.status === 429) return '操作过于频繁，请稍等片刻再试。';
  return error.message || '请求未完成，请稍后重试。';
}

const CHIPS = [
  '给我妈转500，备注生活费',
  '这个月钱都花哪了',
  '有哪些自动续费',
  '下周三我妈生日，帮我准备一下',
  '给李慧转2000',
  '最近有奇怪的消费吗',
  '调高我卡的限额到3万',
];
const chipsEl = document.getElementById('chips');
chipsEl.innerHTML = CHIPS.map(t => `<button class="chip-btn" type="button" data-send="${esc(t)}">${esc(t)}</button>`).join('');
chipsEl.addEventListener('click', e => {
  const button = e.target.closest('[data-send]');
  if (button && !button.disabled) send(button.dataset.send);
});

function scrollChat(behavior = 'smooth') {
  requestAnimationFrame(() => chat.scrollTo({ top:chat.scrollHeight, behavior }));
}

function addMsg(role, html, meta = '') {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'me' ? 'me' : 'agent');
  wrap.innerHTML = (role === 'me' ? '' : `<div class="avatar">${icon('brand')}</div>`) +
    `<div class="bubble">${html}${meta ? `<div class="meta">${esc(meta)}</div>` : ''}</div>`;
  chat.appendChild(wrap);
  scrollChat();
  return wrap;
}

function renderWelcome() {
  chat.innerHTML = `<section class="welcome">
    <div class="welcome-icon">${icon('spark')}</div>
    <div class="eyebrow">YINSHU ASSISTANT</div>
    <h1>今天想办什么？</h1>
    <p>我是银枢，可以替你查账单、管卡片、办转账。你只管说目标，我会先查清事实、判断风险，再把关键选择交给你。</p>
    <div class="trust-list">
      <span class="trust-item">${icon('check-circle')}先查后办</span>
      <span class="trust-item">${icon('shield')}风险分级</span>
      <span class="trust-item">${icon('route')}全程留痕</span>
    </div>
  </section>`;
  input.focus({ preventScroll:true });
}

function rowsHTML(rows = []) {
  return `<div class="rows">${rows.map(([k,v]) => `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`;
}

function stepsHTML(steps = []) {
  return `<div class="steps">${steps.map((s,i) => `<div class="step ${s.gated ? 'gated' : ''}">
    <div class="num">${i + 1}</div><div><div class="step-label">${esc(s.label)}</div><div class="tool">${esc(s.tool)}</div></div>
  </div>`).join('')}</div>`;
}

function cardHTML(c) {
  if (!c) return '';
  const head = (title, tag = '', iconName = 'receipt') => `<div class="card-h">${icon(iconName)}<span>${esc(title)}</span>${tag}</div>`;
  switch (c.type) {
    case 'plan': {
      const tagCls = c.tier === 'AUTO' ? 'auto' : (c.tier === 'CONFIRM' ? 'confirm' : 'danger');
      const tag = c.tier && c.tier !== '-' ? `<span class="tag ${tagCls}">${esc(TIER_LABELS[c.tier] || c.tier)} · ${esc(c.risk)} 分</span>` : '';
      return `<details class="card plan-card"><summary>${icon('route')}<span>查看执行计划 · ${(c.steps || []).length} 步</span>${tag}${icon('chevron','chevron')}</summary><div class="card-b">${stepsHTML(c.steps)}</div></details>`;
    }
    case 'confirm': {
      const tag = `<span class="tag confirm">风险 ${esc(c.risk)} 分</span>`;
      return `<div class="card confirm-card">${head(c.title,tag,'alert')}<div class="card-b">
        ${rowsHTML(c.rows)}
        ${c.reasons?.length ? `<div class="reasons"><h5>${icon('shield')}为什么要你确认</h5><ul>${c.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
        ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
        <div class="btns"><button class="btn ghost" type="button" data-send="取消">取消</button>
        <button class="btn ${c.need_double ? 'danger' : ''}" type="button" data-send="确认">${c.need_double ? '确认（不可逆）' : '确认执行'}</button></div>
      </div></div>`;
    }
    case 'receipt':
      return `<div class="card receipt-card">${head(c.title,'<span class="tag auto">已完成</span>','check-circle')}<div class="card-b">${rowsHTML(c.rows || [])}${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}</div></div>`;
    case 'balance':
      return `<div class="card">${head(c.title)}<div class="card-b">${rowsHTML(c.rows || [])}${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}</div></div>`;
    case 'bill': {
      const mom = c.mom == null ? '' : `<span class="tag ${c.mom >= 0 ? 'danger' : 'auto'}">环比 ${c.mom >= 0 ? '+' : ''}${esc(c.mom)}%</span>`;
      return `<div class="card">${head(c.title,mom)}<div class="card-b">
        <div><span class="bill-total">${esc(c.total)}</span><span class="bill-unit">元 / ${esc(c.count)} 笔</span></div>
        <div class="bill-range">${esc(c.range || '')}</div>
        <div class="bars">${(c.categories || []).map(x => `<div class="bar-row"><div class="bar-top"><span class="n">${esc(x.category)} · ${esc(x.ratio)}%</span><span class="a">${esc(x.amount)}</span></div><div class="bar-bg"><div class="bar-fill" style="width:${clamp(x.ratio)}%"></div></div></div>`).join('')}</div>
      </div></div>`;
    }
    case 'anomaly':
      return `<div class="card">${head(c.title,`<span class="tag danger">${esc(c.count)} 笔</span>`,'alert')}<div class="card-b">${(c.items || []).map(x => `<div class="anom"><div class="l1"><span>${esc(x.merchant)}</span><span>${esc(x.amount)} 元</span></div><div class="l2"><span class="mini-chip">${esc(x.rule)}</span>${esc(x.reason)}</div><div class="l2">${esc(x.ts)}</div></div>`).join('')}${c.count > (c.items || []).length ? `<div class="note">还有 ${c.count - c.items.length} 笔未展示</div>` : ''}</div></div>`;
    case 'wealth':
      return `<div class="card">${head(c.title,`<span class="tag auto">共 ${esc(c.all_count)} 支</span>`)}<div class="card-b">${(c.products || []).map(p => `<div class="prod"><div class="pn"><span>${esc(p.name)}</span><span class="rate">${esc(p.annual_rate)}%</span></div><div class="pm"><span class="pill">${esc(p.risk)}</span><span class="pill">${esc(p.category)}</span><span class="pill">${p.term_days == 0 ? '随时赎回' : esc(p.term_days) + ' 天'}</span><span class="pill">起购 ${esc(p.min_amount)}</span></div></div>`).join('')}</div></div>`;
    case 'subs':
      return `<div class="card">${head(c.title,`<span class="tag confirm">年化 ${esc(c.annual_total)} 元</span>`)}<div class="card-b">${(c.items || []).map(i => `<div class="sub-item"><div><div class="m">${esc(i.merchant)}</div><div class="d">${esc(i.amount)} 元/${esc(i.cycle)}${i.note ? ' · ' + esc(i.note) : ''}</div></div><div class="amt">${esc(i.annual)}/年</div></div>`).join('')}</div></div>`;
    case 'cards':
      return `<div class="card">${head(c.title,`<span class="tag auto">${(c.items || []).length} 张</span>`)}<div class="card-b">${(c.items || []).map(i => `<div class="sub-item"><div><div class="m">${esc(i.brand)} · 尾号 ${esc(i.last4)}</div><div class="d">日交易限额 ${esc(i.limit)} 元</div></div><div class="amt">${esc(i.status)}</div></div>`).join('')}</div></div>`;
    case 'choose':
      return `<div class="card">${head(c.title,'<span class="tag confirm">请选择</span>')}<div class="card-b">${(c.options || []).map((o,i) => `<button class="opt" type="button" data-send="第${i + 1}个"><div class="ol">第 ${i + 1} 个 · ${esc(o.label)}</div><div class="os">${esc(o.sub)}</div></button>`).join('')}${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}</div></div>`;
    case 'notice':
      return `<div class="card">${head(c.title,'',c.tone === 'danger' ? 'alert' : 'receipt')}<div class="card-b"><div class="notice ${esc(c.tone || '')}"><div class="bar"></div><div><ul>${(c.lines || []).map(l => `<li>${esc(l)}</li>`).join('')}</ul></div></div></div></div>`;
    default:
      return `<div class="card"><div class="card-b"><pre style="margin:0;font:10px/1.6 var(--mono);white-space:pre-wrap">${esc(JSON.stringify(c,null,2))}</pre></div></div>`;
  }
}

function continuationHTML(d) {
  if (d.state === 'AWAIT_CONFIRM' && d.card?.type !== 'confirm') {
    return `<div class="continuation"><div class="continuation-title">这一步仍需你确认，确认前不会继续执行。</div><div class="btns"><button class="btn ghost" type="button" data-send="取消">取消</button><button class="btn danger" type="button" data-send="确认">再次确认</button></div></div>`;
  }
  return '';
}

function markActionsStale() {
  chat.querySelectorAll('[data-send]').forEach(button => {
    button.dataset.stale = 'true';
    button.disabled = true;
  });
}

function setBusy(value) {
  busy = value;
  chat.setAttribute('aria-busy', String(value));
  sendBtn.disabled = value;
  document.getElementById('newSession').disabled = value;
  sendBtn.innerHTML = value ? '<span class="spinner"></span><span>处理中</span>' : `${icon('send')}<span>发送</span>`;
  document.querySelectorAll('.chip-btn').forEach(button => button.disabled = value);
  chat.querySelectorAll('[data-send]').forEach(button => button.disabled = value || button.dataset.stale === 'true');
}

async function send(text, { retryTarget = null } = {}) {
  const value = String(text || '').trim();
  if (!value) return;
  if (busy) { toast('上一条指令正在处理，请稍候'); return; }
  setBusy(true);
  if (!retryTarget) addMsg('me', esc(value));
  markActionsStale();
  const target = retryTarget || addMsg('agent', `<div class="typing"><i></i><i></i><i></i><span class="typing-label">正在理解并检查风险</span></div>`);
  target.dataset.retry = value;
  target.querySelector('.bubble').innerHTML = `<div class="typing"><i></i><i></i><i></i><span class="typing-label">正在理解并检查风险</span></div>`;
  try {
    const d = await apiFetch('/api/chat', { method:'POST', body:JSON.stringify({ session_id:sessionId, text:value }) });
    if (!d.session_id) throw new Error('响应缺少会话标识，请重试');
    sessionId = d.session_id;
    localStorage.setItem('ys_sid', sessionId);
    const plan = d.debug?.plan?.length ? {
      type:'plan', title:'执行计划（DAG）',
      steps:d.debug.plan.map(s => ({ label:s.label, tool:s.tool, gated:!!s.gated })),
      tier:d.debug.decision?.tier || '-', risk:d.debug.decision?.risk ?? '-'
    } : null;
    target.querySelector('.bubble').innerHTML = `<div class="reply">${esc(d.reply)}</div>${cardHTML(plan)}${cardHTML(d.card)}${continuationHTML(d)}<div class="meta"><span>trace ${esc((d.trace_id || '').slice(0,12))}</span><span>${esc(d.debug?.latency_ms ?? '-')} ms</span><span>${esc(d.debug?.intent_label || d.debug?.intent || '')}</span></div>`;
    delete target.dataset.retry;
    lastDebug = d.debug || {};
    lastRaw = lastDebug;
    lastState = d.state;
    lastAudit = null;
    updateInputHint(d.state);
    renderInsights();
    scrollChat('auto');
  } catch (error) {
    target.querySelector('.bubble').innerHTML = `<div class="error-box">${icon('alert')}<div><div class="error-title">这次请求没有完成</div><div class="error-text">${esc(friendlyError(error))}</div></div><button class="btn" type="button" data-retry>重试</button></div>`;
  } finally {
    setBusy(false);
    scrollChat('auto');
  }
}

chat.addEventListener('click', e => {
  const action = e.target.closest('[data-send]');
  if (action && !action.disabled) { send(action.dataset.send); return; }
  const retry = e.target.closest('[data-retry]');
  if (retry) {
    const message = retry.closest('.msg');
    if (message?.dataset.retry) send(message.dataset.retry, { retryTarget:message });
  }
});

function updateInputHint(state) {
  const hints = {
    CHOOSE:'点击上方选项，或输入「第1个」',
    AWAIT_CONFIRM:'使用上方按钮，或输入「确认 / 取消」',
    CLARIFY:'补充缺失信息，我会接着办理',
    IDLE:'说一句你要办的事…'
  };
  input.placeholder = hints[state] || hints.IDLE;
}

function renderInsights() {
  document.querySelectorAll('[data-view]').forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.view === debugView)));
  if (!lastDebug) {
    dbg.innerHTML = `<div class="debug-empty"><div class="empty-icon">${icon('route')}</div><h2>等待第一条指令</h2><p>发起业务后，这里会展示意图识别、执行计划、风险决策和审计摘要。</p></div>`;
    return;
  }
  if (debugView === 'raw') {
    dbg.innerHTML = `<pre class="raw-json">${colorize(JSON.stringify(lastRaw ?? lastDebug,null,2))}</pre>`;
    return;
  }
  const decision = lastDebug.decision || {};
  const plan = lastDebug.plan || [];
  const tier = decision.tier || '-';
  const risk = decision.risk ?? 0;
  const reasons = decision.reasons || [];
  const audit = lastDebug.audit || {};
  dbg.innerHTML = `<div class="trace-hero"><div><div class="trace-label">CURRENT INTENT</div><div class="trace-intent">${esc(lastDebug.intent_label || lastDebug.intent || '未识别意图')}</div></div><span class="state-pill">${esc(STATE_LABELS[lastState] || lastState || '已响应')}</span></div>
    <section class="debug-card"><div class="metric-grid">
      <div class="metric"><div class="metric-label">识别置信度</div><div class="metric-value">${lastDebug.confidence == null ? '—' : esc(Math.round(Number(lastDebug.confidence) * 100)) + '%'}</div></div>
      <div class="metric"><div class="metric-label">执行步骤</div><div class="metric-value">${plan.length} 步</div></div>
      <div class="metric"><div class="metric-label">响应耗时</div><div class="metric-value">${esc(lastDebug.latency_ms ?? '—')} ms</div></div>
    </div></section>
    <section class="debug-card"><div class="debug-card-h"><span>${icon('shield')}风险决策</span><span class="tag ${tier === 'AUTO' ? 'auto' : tier === 'CONFIRM' ? 'confirm' : 'danger'}">${esc(TIER_LABELS[tier] || tier)}</span></div>
      <div class="decision-top"><div class="risk-score">${esc(risk)}</div><div class="risk-copy"><strong>风险评分 / 100</strong>策略引擎实时计算</div></div>
      <div class="risk-track"><div class="risk-fill" style="width:${clamp(risk)}%"></div></div>
      ${reasons.length ? `<ul class="decision-reasons">${reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '<div class="audit-line">本次无额外风险提示</div>'}
    </section>
    <section class="debug-card"><div class="debug-card-h"><span>${icon('route')}执行计划</span><span>${plan.length} STEPS</span></div>
      ${plan.length ? plan.map((s,i) => `<div class="debug-step"><div class="num">${i + 1}</div><div><div class="debug-step-name">${esc(s.label)}</div><div class="debug-step-tool">${esc(s.tool)}</div></div></div>`).join('') : '<div class="audit-line">本次请求未进入执行阶段</div>'}
    </section>
    <section class="debug-card"><div class="debug-card-h"><span>${icon('lock')}审计摘要</span></div>
      <div class="audit-line"><span>记录序号</span><strong>#${esc(audit.id ?? '—')}</strong></div>
      <div class="audit-line" style="margin-top:7px"><span>链上哈希</span><strong>${esc(audit.seq_hash || '等待写入')}</strong></div>
      ${lastAudit ? `<div class="audit-result ${lastAudit.ok ? '' : 'bad'}">${icon(lastAudit.ok ? 'check-circle' : 'alert')}<span>${lastAudit.ok ? `审计链完整，共校验 ${esc(lastAudit.total)} 条记录。` : '审计链校验未通过，请查看原始数据定位断点。'}</span></div>` : ''}
    </section>`;
}

function colorize(s) {
  return esc(s).replace(/&quot;([^&]+?)&quot;(\s*:)/g,'<span class="k">"$1"</span>$2').replace(/&quot;([^&]*?)&quot;/g,'<span class="s">"$1"</span>').replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>');
}

document.querySelectorAll('[data-view]').forEach(tab => tab.addEventListener('click', () => {
  debugView = tab.dataset.view;
  renderInsights();
}));

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const value = input.value.trim();
  if (!value) { input.focus(); return; }
  if (busy) { toast('上一条指令正在处理，输入内容已保留'); return; }
  input.value = '';
  send(value);
});

verifyBtn.addEventListener('click', async () => {
  if (busy) return;
  verifyBtn.disabled = true;
  verifyBtn.innerHTML = '<span class="spinner" style="border-color:#d7deea;border-top-color:var(--brand)"></span><span>正在校验…</span>';
  try {
    const d = await apiFetch('/api/audit/verify');
    lastAudit = d;
    lastRaw = { audit_verification:d };
    renderInsights();
    toast(d.ok ? `审计链完整，共 ${d.total} 条记录` : '审计链校验未通过，请检查原始数据');
  } catch (error) {
    toast(friendlyError(error));
  } finally {
    verifyBtn.disabled = false;
    verifyBtn.innerHTML = `${icon('shield')}<span>校验审计链</span>`;
  }
});

document.getElementById('newSession').addEventListener('click', () => {
  if (busy) return;
  sessionId = null;
  localStorage.removeItem('ys_sid');
  lastDebug = lastRaw = lastState = lastAudit = null;
  debugView = 'overview';
  updateInputHint('IDLE');
  input.value = '';
  closeTrace();
  renderWelcome();
  renderInsights();
  toast('已开始新会话');
});

function syncTraceA11y() {
  if (window.innerWidth <= 920) insights.setAttribute('aria-hidden', String(!appShell.classList.contains('drawer-open')));
  else insights.removeAttribute('aria-hidden');
}
function openTrace() { appShell.classList.add('drawer-open'); syncTraceA11y(); document.getElementById('closeTrace').focus(); }
function closeTrace() { appShell.classList.remove('drawer-open'); syncTraceA11y(); }
document.getElementById('openTrace').addEventListener('click', openTrace);
document.getElementById('closeTrace').addEventListener('click', closeTrace);
overlay.addEventListener('click', closeTrace);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTrace(); });
window.addEventListener('resize', syncTraceA11y);

renderWelcome();
renderInsights();
syncTraceA11y();

// 演示/截图用：?m=给我妈转500&m=这个月钱都花哪了 会自动依次执行
(() => {
  const msgs = [...new URLSearchParams(location.search).getAll('m'), ...new URLSearchParams(location.hash.replace(/^#/,'')).getAll('m')];
  if (!msgs.length) return;
  (async () => {
    for (const message of msgs) {
      await new Promise(resolve => setTimeout(resolve,700));
      await send(message);
    }
  })();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>银枢 YinShu · 可信银行智能体</title>
<style>
  :root{
    --bg:#eef1f7; --panel:#fff; --ink:#152033; --muted:#7a879b; --line:#e3e8f0;
    --brand:#2a4fd0; --brand-soft:#eef2ff; --ok:#128a6e; --ok-soft:#e8f7f2;
    --warn:#c2761a; --warn-soft:#fdf3e3; --danger:#c93b3b; --danger-soft:#fdecec;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 15% -10%,#dfe7ff 0%,transparent 60%),
    radial-gradient(900px 500px at 100% 0%,#e2f6f1 0%,transparent 55%),var(--bg);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:var(--ink);display:flex;align-items:center;justify-content:center;padding:12px;
    overflow:hidden;
  }
  .stage{display:flex;gap:16px;align-items:stretch;max-width:1180px;width:100%;
    justify-content:center;height:calc(100vh - 24px);max-height:860px}

  /* ---------- 手机壳 ---------- */
  .phone{
    width:400px;height:100%;background:var(--panel);border-radius:30px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(24,40,80,.18),0 2px 6px rgba(24,40,80,.06);
    border:1px solid rgba(255,255,255,.7);position:relative;
  }
  .statusbar{height:26px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;font-size:11px;color:var(--muted);background:linear-gradient(180deg,#f7f9fe,#fff)}
  header{padding:12px 18px 14px;background:linear-gradient(180deg,#fff,#f8faff);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:11px;flex:0 0 auto}
  .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2a4fd0,#5b7cff);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.5px;
    box-shadow:0 4px 12px rgba(42,79,208,.3)}
  .h-title{font-size:15px;font-weight:650;letter-spacing:.2px}
  .h-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .h-badge{margin-left:auto;font-size:10.5px;color:var(--ok);background:var(--ok-soft);
    border:1px solid #c9ece1;padding:4px 8px;border-radius:20px;display:flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #d8f2ea}

  main{flex:1 1 auto;overflow-y:auto;padding:16px 14px 4px;display:flex;flex-direction:column;gap:12px;
    background:linear-gradient(180deg,#fbfcff,#f6f8fd);scroll-behavior:smooth}
  main::-webkit-scrollbar{width:5px}
  main::-webkit-scrollbar-thumb{background:#d5dceb;border-radius:3px}

  .msg{display:flex;gap:8px;max-width:100%}
  .msg.me{justify-content:flex-end}
  .avatar{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,#2a4fd0,#6b88ff);
    color:#fff;font-size:11px;display:grid;place-items:center;flex:0 0 auto;margin-top:2px;font-weight:600}
  .bubble{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;
    line-height:1.65;box-shadow:0 1px 2px rgba(24,40,80,.04);max-width:calc(100% - 36px)}
  .me .bubble{background:linear-gradient(135deg,#2a4fd0,#4a6ee8);color:#fff;border:none;
    box-shadow:0 4px 14px rgba(42,79,208,.25)}
  .meta{font-size:10px;color:#9aa7ba;margin-top:6px;font-family:var(--mono)}

  /* ---------- 卡片 ---------- */
  .card{margin-top:9px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
  .card-h{padding:9px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;
    border-bottom:1px solid var(--line);background:#fafbff}
  .card-h .tag{margin-left:auto;font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px}
  .tag.auto{background:var(--ok-soft);color:var(--ok)}
  .tag.confirm{background:var(--warn-soft);color:var(--warn)}
  .tag.danger{background:var(--danger-soft);color:var(--danger)}
  .card-b{padding:11px 12px}
  .rows{display:flex;flex-direction:column;gap:7px}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
  .row .k{color:var(--muted);flex:0 0 auto}
  .row .v{text-align:right;font-weight:550;word-break:break-all}
  .note{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted)}

  .reasons{margin-top:10px;background:var(--warn-soft);border-radius:9px;padding:8px 10px}
  .reasons h5{margin:0 0 5px;font-size:11px;color:var(--warn);font-weight:600}
  .reasons li{font-size:11.5px;color:#7a5a20;margin:3px 0;margin-left:-6px;list-style:none}
  .reasons li::before{content:"· ";font-weight:700}

  .btns{display:flex;gap:8px;margin-top:11px}
  .btn{flex:1;border:none;border-radius:9px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--brand);color:#fff;transition:.15s;font-family:inherit}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:#f1f4fa;color:#5b6880}
  .btn.danger{background:var(--danger)}

  .bars{display:flex;flex-direction:column;gap:8px}
  .bar-row{font-size:12px}
  .bar-top{display:flex;justify-content:space-between;margin-bottom:3px}
  .bar-top .n{color:#31405a}
  .bar-top .a{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .bar-bg{height:6px;border-radius:4px;background:#eef1f7;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#3a5fe0,#6b8bff)}
  .bar-row:nth-child(2) .bar-fill{background:linear-gradient(90deg,#0f9d8a,#4bc7b4)}
  .bar-row:nth-child(3) .bar-fill{background:linear-gradient(90deg,#c2761a,#e8a94f)}
  .bar-row:nth-child(4) .bar-fill{background:linear-gradient(90deg,#7a5cd6,#a68bf0)}

  .anom{border-left:3px solid var(--danger);background:#fffafa;border-radius:8px;padding:8px 10px;margin-bottom:7px}
  .anom .l1{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
  .anom .l2{font-size:11px;color:#9a6a6a;margin-top:4px}
  .chip{display:inline-block;font-size:10px;padding:2px 6px;border-radius:5px;background:var(--danger-soft);
    color:var(--danger);margin-right:5px;font-weight:600}

  .prod{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;background:#fcfdff}
  .prod .pn{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
  .prod .rate{color:var(--danger);font-family:var(--mono);font-size:15px;font-weight:700}
  .prod .pm{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  .pill{background:#f1f4fa;border-radius:5px;padding:2px 6px}

  .sub-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;
    border-bottom:1px solid #f1f4fa;font-size:12.5px}
  .sub-item:last-child{border:none}
  .sub-item .m{font-weight:600}
  .sub-item .d{font-size:10.5px;color:var(--muted);margin-top:2px}
  .sub-item .amt{font-family:var(--mono);color:#31405a}

  .opt{width:100%;text-align:left;border:1px solid var(--line);background:#fcfdff;border-radius:10px;
    padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.15s;font-family:inherit}
  .opt:hover{border-color:#b9c6ee;background:var(--brand-soft)}
  .opt .ol{font-size:12.5px;font-weight:600}
  .opt .os{font-size:10.5px;color:var(--muted);margin-top:2px}

  .steps{display:flex;flex-direction:column;gap:0}
  .step{display:flex;gap:9px;font-size:11.5px;position:relative;padding-bottom:11px}
  .step:last-child{padding-bottom:0}
  .step .num{width:16px;height:16px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
    font-size:9.5px;display:grid;place-items:center;flex:0 0 auto;font-weight:700;z-index:1}
  .step.gated .num{background:var(--warn-soft);color:var(--warn)}
  .step::before{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--line)}
  .step:last-child::before{display:none}
  .step .tool{font-family:var(--mono);font-size:10px;color:#8b98ad}

  .notice{display:flex;gap:9px;align-items:flex-start}
  .notice .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--muted)}
  .notice.warn .bar{background:var(--warn)}
  .notice.danger .bar{background:var(--danger)}
  .notice.ok .bar{background:var(--ok)}
  .notice ul{margin:5px 0 0;padding-left:15px;font-size:11.5px;color:#5d6a80}

  /* ---------- 输入区 ---------- */
  .chips{display:flex;gap:7px;padding:8px 12px 0;overflow-x:auto;flex:0 0 auto}
  .chips::-webkit-scrollbar{display:none}
  .chip-btn{white-space:nowrap;font-size:11.5px;padding:6px 11px;border-radius:20px;border:1px solid #dbe2f0;
    background:#fff;color:#41506b;cursor:pointer;font-family:inherit;transition:.15s}
  .chip-btn:hover{background:var(--brand-soft);border-color:#b9c6ee;color:var(--brand)}
  .composer{display:flex;gap:8px;padding:10px 12px 14px;background:#fff;border-top:1px solid var(--line);flex:0 0 auto}
  .composer input{flex:1;border:1px solid var(--line);background:#f7f9fd;border-radius:11px;padding:11px 13px;
    font-size:13px;outline:none;font-family:inherit;transition:.15s}
  .composer input:focus{border-color:#a9bcf0;background:#fff;box-shadow:0 0 0 3px rgba(42,79,208,.08)}
  .composer button{border:none;background:var(--brand);color:#fff;border-radius:11px;padding:0 16px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .composer button:disabled{opacity:.5;cursor:default}

  .typing{display:flex;gap:4px;padding:4px 2px}
  .typing i{width:5px;height:5px;border-radius:50%;background:#b7c2d6;animation:b 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

  /* ---------- 调试面板 ---------- */
  .debug{width:330px;display:flex;flex-direction:column;background:#121a2b;border-radius:18px;overflow:hidden;
    box-shadow:0 20px 50px rgba(18,26,43,.28);color:#c9d4e6;height:100%}
  .debug-h{padding:11px 14px;font-size:12px;display:flex;align-items:center;gap:8px;background:#0d1421;
    border-bottom:1px solid #1e2a40;font-weight:600}
  .debug-h .live{width:6px;height:6px;border-radius:50%;background:#3ddc97;box-shadow:0 0 0 3px rgba(61,220,151,.15)}
  .debug-h button{margin-left:auto;background:#1e2a40;color:#9fb0c9;border:none;border-radius:6px;
    font-size:10.5px;padding:4px 8px;cursor:pointer;font-family:inherit}
  .debug pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:11px;line-height:1.6;
    overflow:auto;flex:1;color:#8ea6c8;white-space:pre-wrap;word-break:break-all}
  .debug pre .k{color:#7ad0ff}
  .debug pre .s{color:#ffd479}
  .debug pre .n{color:#b9a0ff}
  @media (max-width:860px){.debug{display:none}.stage{justify-content:center}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>银枢 · 演示环境</span><span>5G ▮▮▮</span></div>
    <header>
      <div class="logo">银枢</div>
      <div>
        <div class="h-title">银枢 YinShu</div>
        <div class="h-sub">可信银行智能体 · 权限边界内代办</div>
      </div>
      <div class="h-badge"><span class="dot"></span>风控在线</div>
    </header>

    <main id="chat"></main>

    <div class="chips" id="chips"></div>
    <form class="composer" id="form" autocomplete="off">
      <input id="q" placeholder="说一句你要办的事…" />
      <button id="send" type="submit">发送</button>
    </form>
  </div>

  <aside class="debug">
    <div class="debug-h"><span class="live"></span>执行轨迹 / 决策依据
      <button id="verify">校验审计链</button>
    </div>
    <pre id="debugBody">等待第一条指令…</pre>
  </aside>
</div>

<script>
const chat = document.getElementById('chat');
const dbg = document.getElementById('debugBody');
let sessionId = localStorage.getItem('ys_sid') || null;
let busy = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = s => s == null ? '' : String(s);

const CHIPS = [
  '给我妈转500，备注生活费',
  '这个月钱都花哪了',
  '有哪些自动续费',
  '下周三我妈生日，帮我准备一下',
  '给李慧转2000',
  '最近有奇怪的消费吗',
  '调高我卡的限额到3万',
];
const chipsEl = document.getElementById('chips');
chipsEl.innerHTML = CHIPS.map(t => `<button class="chip-btn">${esc(t)}</button>`).join('');
chipsEl.addEventListener('click', e => {
  const b = e.target.closest('.chip-btn'); if (b) send(b.textContent);
});

function addMsg(role, html, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'me' ? 'me' : '');
  wrap.innerHTML = (role === 'me' ? '' : '<div class="avatar">枢</div>') +
    `<div class="bubble">${html}${meta ? `<div class="meta">${esc(meta)}</div>` : ''}</div>`;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function rowsHTML(rows) {
  return `<div class="rows">${rows.map(([k, v]) =>
    `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`;
}

function cardHTML(c) {
  if (!c) return '';
  const head = (title, tag) => `<div class="card-h">${esc(title)}${tag || ''}</div>`;
  switch (c.type) {
    case 'plan': {
      const tagCls = c.tier === 'AUTO' ? 'auto' : (c.tier === 'CONFIRM' ? 'confirm' : 'danger');
      const tag = c.tier && c.tier !== '-' ? `<span class="tag ${tagCls}">${esc(c.tier)} · 风险 ${esc(c.risk)}</span>` : '';
      return `<div class="card">${head(c.title, tag)}<div class="card-b"><div class="steps">${
        c.steps.map((s, i) => `<div class="step ${s.gated ? 'gated' : ''}">
          <div class="num">${i + 1}</div>
          <div><div>${esc(s.label)}${s.gated ? ' <span style="color:#c2761a;font-size:10px">·需确认</span>' : ''}</div>
          <div class="tool">${esc(s.tool)}</div></div></div>`).join('')}</div></div></div>`;
    }
    case 'confirm': {
      const tag = `<span class="tag confirm">需确认 · 风险 ${esc(c.risk)}</span>`;
      return `<div class="card">${head(c.title, tag)}<div class="card-b">
        ${rowsHTML(c.rows)}
        ${c.reasons && c.reasons.length ? `<div class="reasons"><h5>为什么要你确认</h5>
          ${c.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</div>` : ''}
        ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
        <div class="btns">
          <button class="btn ghost" onclick="send('取消')">取消</button>
          <button class="btn" onclick="send('确认')">${c.need_double ? '确认（不可逆）' : '确认执行'}</button>
        </div></div></div>`;
    }
    case 'receipt':
      return `<div class="card">${head('✓ ' + c.title, '<span class="tag auto">已完成</span>')}
        <div class="card-b">${rowsHTML(c.rows || [])}
        ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}</div></div>`;
    case 'balance':
      return `<div class="card">${head(c.title)}<div class="card-b">${rowsHTML(c.rows || [])}
        ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}</div></div>`;
    case 'bill': {
      const mom = c.mom == null ? '' : `<span class="tag ${c.mom >= 0 ? 'danger' : 'auto'}">环比 ${c.mom >= 0 ? '+' : ''}${c.mom}%</span>`;
      return `<div class="card">${head(c.title, mom)}<div class="card-b">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <div><span style="font-size:22px;font-weight:700;font-family:var(--mono)">${esc(c.total)}</span>
          <span style="font-size:11px;color:var(--muted)"> 元 / ${esc(c.count)} 笔</span></div>
        </div>
        <div style="font-size:10.5px;color:#9aa7ba;margin-bottom:11px;font-family:var(--mono)">${esc(c.range || '')}</div>
        <div class="bars">${(c.categories || []).map(x => `
          <div class="bar-row"><div class="bar-top"><span class="n">${esc(x.category)} · ${esc(x.ratio)}%</span>
          <span class="a">${esc(x.amount)}</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100, x.ratio)}%"></div></div></div>`).join('')}
        </div></div></div>`;
    }
    case 'anomaly':
      return `<div class="card">${head(c.title, `<span class="tag danger">${esc(c.count)} 笔</span>`)}
        <div class="card-b">${(c.items || []).map(x => `
          <div class="anom"><div class="l1"><span>${esc(x.merchant)}</span><span>${esc(x.amount)} 元</span></div>
          <div class="l2"><span class="chip">${esc(x.rule)}</span>${esc(x.reason)}</div>
          <div class="l2" style="opacity:.7">${esc(x.ts)}</div></div>`).join('')}
        ${c.count > (c.items || []).length ? `<div class="note">还有 ${c.count - c.items.length} 笔未展示</div>` : ''}
        </div></div>`;
    case 'wealth':
      return `<div class="card">${head(c.title, `<span class="tag auto">共 ${esc(c.all_count)} 支</span>`)}
        <div class="card-b">${(c.products || []).map(p => `
          <div class="prod"><div class="pn"><span>${esc(p.name)}</span><span class="rate">${esc(p.annual_rate)}%</span></div>
          <div class="pm"><span class="pill">${esc(p.risk)}</span><span class="pill">${esc(p.category)}</span>
          <span class="pill">${p.term_days == 0 ? '随时赎回' : p.term_days + ' 天'}</span>
          <span class="pill">起购 ${esc(p.min_amount)}</span></div></div>`).join('')}
        </div></div>`;
    case 'subs':
      return `<div class="card">${head(c.title, `<span class="tag confirm">年化 ${esc(c.annual_total)} 元</span>`)}
        <div class="card-b">${(c.items || []).map(i => `
          <div class="sub-item"><div><div class="m">${esc(i.merchant)}</div>
          <div class="d">${esc(i.amount)} 元/${esc(i.cycle)}${i.note ? ' · ' + esc(i.note) : ''}</div></div>
          <div class="amt">${esc(i.annual)}/年</div></div>`).join('')}</div></div>`;
    case 'cards':
      return `<div class="card">${head(c.title, `<span class="tag auto">${(c.items || []).length} 张</span>`)}
        <div class="card-b">${(c.items || []).map(i => `
          <div class="sub-item"><div><div class="m">${esc(i.brand)} · 尾号 ${esc(i.last4)}</div>
          <div class="d">日交易限额 ${esc(i.limit)} 元</div></div>
          <div class="amt">${esc(i.status)}</div></div>`).join('')}</div></div>`;
    case 'choose':
      return `<div class="card">${head(c.title)}<div class="card-b">
        ${(c.options || []).map((o, i) => `<button class="opt" onclick="send('第${i + 1}个')">
          <div class="ol">第 ${i + 1} 个 · ${esc(o.label)}</div>
          <div class="os">${esc(o.sub)}</div></button>`).join('')}
        ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}</div></div>`;
    case 'notice': {
      // 内层标题与卡片标题重复时就不再重复渲染一遍
      const sub = c.title === '可以试试这些' ? '试试这样说：' : c.title;
      const lead = (sub && sub !== c.title) ? `<div style="font-size:12.5px">${esc(sub)}</div>` : '';
      return `<div class="card">${head(c.title)}<div class="card-b"><div class="notice ${c.tone || ''}">
        <div class="bar"></div><div>${lead}
        <ul>${(c.lines || []).map(l => `<li>${esc(l)}</li>`).join('')}</ul></div></div></div></div>`;
    }
    default:
      return `<div class="card"><div class="card-b"><pre style="margin:0;font-size:11px">${esc(JSON.stringify(c, null, 2))}</pre></div></div>`;
  }
}

async function send(text) {
  if (busy || !text || !text.trim()) return;
  busy = true;
  document.getElementById('send').disabled = true;
  addMsg('me', esc(text));
  const t = addMsg('agent', '<div class="typing"><i></i><i></i><i></i></div>');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, text, device_trusted: true })
    });
    const d = await r.json();
    sessionId = d.session_id;
    localStorage.setItem('ys_sid', sessionId);
    const plan = (d.debug && d.debug.plan) ? { type: 'plan', title: '执行计划（DAG）', steps: d.debug.plan.map(s => ({ label: s.label, tool: s.tool, gated: !!s.gated })), tier: d.debug.decision ? d.debug.decision.tier : '-', risk: d.debug.decision ? d.debug.decision.risk : '-' } : null;
    t.querySelector('.bubble').innerHTML =
      `<div>${esc(d.reply)}</div>` +
      (plan ? cardHTML(plan) : '') +
      cardHTML(d.card) +
      `<div class="meta">trace ${esc(d.trace_id)} · ${esc(d.debug?.latency_ms ?? '')}ms · ${esc(d.debug?.intent_label || d.debug?.intent || '')}</div>`;
    dbg.innerHTML = colorize(JSON.stringify(d.debug, null, 2));
    setTimeout(() => {
      chat.scrollTo({ top: chat.scrollHeight, behavior: 'instant' });
    }, 60);
  } catch (e) {
    t.querySelector('.bubble').innerHTML = `<div style="color:#c93b3b">请求失败：${esc(e.message)}</div>`;
  }
  busy = false;
  document.getElementById('send').disabled = false;
}

function colorize(s) {
  return esc(s)
    .replace(/&quot;([^&]+?)&quot;(\s*:)/g, '<span class="k">"$1"</span>$2')
    .replace(/&quot;([^&]*?)&quot;/g, '<span class="s">"$1"</span>')
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="n">$1</span>');
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const el = document.getElementById('q');
  const v = el.value.trim();
  if (!v) return;
  el.value = '';
  send(v);
});

document.getElementById('verify').addEventListener('click', async () => {
  const r = await fetch('/api/audit/verify');
  const d = await r.json();
  dbg.innerHTML = colorize(JSON.stringify(d, null, 2));
});

addMsg('agent', `<div>我是<b>银枢</b>，能替你在<b>权限范围内</b>把银行的事办完。</div>
<div style="margin-top:6px;font-size:12px;color:#7a879b">每笔操作都会先查、再判断风险、要不要你确认由规则决定，不由我随口决定。</div>`);

// 演示/截图用：打开 ?m=给我妈转500&m=这个月钱都花哪了 （或 #m=...）会自动依次执行
(() => {
  const msgs = [
    ...new URLSearchParams(location.search).getAll('m'),
    ...new URLSearchParams(location.hash.replace(/^#/, '')).getAll('m'),
  ];
  if (!msgs.length) return;
  (async () => {
    for (const m of msgs) {
      await new Promise(r => setTimeout(r, 900));
      await send(m);
    }
  })();
})();
</script>
</body>

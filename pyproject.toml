[project]
name = "yinshu"
version = "1.0.0"
description = "银枢 YinShu：面向银行业务场景的智能体演示系统"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp 放仓库内（`.tmp/` 已被 .gitignore 忽略），避免写系统临时目录；
# 父目录由 tests/conftest.py 在导入时创建——pytest 9 创建 basetemp 时不带 parents=True。
addopts = "-q --strict-markers --basetemp=.tmp/pytest"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/mock_bank/seed.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
